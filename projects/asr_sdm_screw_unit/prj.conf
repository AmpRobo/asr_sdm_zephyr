# SPDX-License-Identifier: Apache-2.0

# Keep main preemptible while USB CDC logging is coming up.
CONFIG_MAIN_THREAD_PRIORITY=1

CONFIG_GPIO=y

# Common shared types and utilities
CONFIG_ASR_COMMON=y

# User LED (PWM brightness on pwm_led0 / GP25)
CONFIG_LED=y
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_ASR_USR_LED=y

# WS2812 RGB NeoPixel LED (GP22, PIO0)
CONFIG_LED_STRIP=y
CONFIG_ASR_RGB_LED=y

# LED background thread (usr_led steady on, rgb_led blinks blue)
CONFIG_ASR_LED_THREAD=y

# Enable SPI bus
CONFIG_SPI=y

# Enable sensor subsystem
CONFIG_SENSOR=y
CONFIG_ICM45686=y
CONFIG_ICM45686_TRIGGER_NONE=y
CONFIG_ASR_IMU=y
CONFIG_ASR_IMU_THREAD=y
CONFIG_ASR_IMU_STARTUP_DELAY_MS=100
CONFIG_ASR_IMU_PERIOD_MS=20
CONFIG_ASR_IMU_LOG_INTERVAL_MS=5000

# HP206F barometer on I2C0 (D14/GP16 SDA, D13/GP17 SCL).
# HP206F pressure/temperature commands are compatible with Zephyr's HP206C driver.
CONFIG_I2C=y
CONFIG_HP206C=y
CONFIG_HP206C_OSR_RUNTIME=y
CONFIG_I2C_LOG_LEVEL_INF=y
CONFIG_ASR_BAROMETER=y
CONFIG_ASR_BAROMETER_THREAD=y
CONFIG_ASR_BAROMETER_OSR=1024
CONFIG_ASR_BAROMETER_STARTUP_DELAY_MS=300
CONFIG_ASR_BAROMETER_PERIOD_MS=500
CONFIG_ASR_BAROMETER_LOG_INTERVAL_MS=5000
CONFIG_ASR_BAROMETER_THREAD_STACK_SIZE=1536
CONFIG_ASR_BAROMETER_THREAD_PRIORITY=11

# Enable floating-point printf support
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logging configuration
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_INF=y

# USB CDC ACM (serial over USB) — new device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# BCAN-S01 PROTOL CAN transport (UART0, D6=TX/GP0, D7=RX/GP1).
# The legacy AA55 UART protocol source remains available but is not enabled here.
CONFIG_ASR_TRANSPORT_BCAN_PROTOL=y
CONFIG_ASR_CAN_PROTOCOL_REQUEST_CAN_ID=0x123
CONFIG_ASR_CAN_PROTOCOL_RESPONSE_CAN_ID=0x124
CONFIG_ASR_BCAN_PROTOL_RX_QUEUE_DEPTH=8
CONFIG_ASR_BCAN_INTERBYTE_TIMEOUT_MS=20
CONFIG_ASR_CAN_PROTOCOL_THREAD_STACK_SIZE=2048
CONFIG_ASR_CAN_PROTOCOL_THREAD_PRIORITY=9

# Single-servo Dynamixel RS-485 driver on UART1 with manual DE/RE control
# on D2/GP28.
CONFIG_ASR_DYNAMIXEL=y
CONFIG_ASR_DYNAMIXEL_THREAD=y

# CPU monitor (per-thread usage logging)
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_ASR_CPU_MONITOR=y

# Wait for USB connection before startup (optional to avoid missing boot logs)
CONFIG_BOOT_DELAY=1000
